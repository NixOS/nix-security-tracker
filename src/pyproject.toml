[project]
name = "nix-security-tracker"
version = "0.0.1"

[tool.setuptools]
packages = { find = {} }
include-package-data = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
filterwarnings = [
  # `manage.py test` imports pytest_django before pytest starts
  # so pytest can't assert-rewrite that plugin.
  "ignore:Module already imported so cannot be rewritten; pytest_django:pytest.PytestAssertRewriteWarning",
]
addopts = "--disable-socket --allow-hosts=localhost"
