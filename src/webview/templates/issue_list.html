{% extends "base.html" %}
{% load viewutils %}

{% block content %}

  <h1 class="page-title row gap-small centered">{% status_icon "published" %}Published issues</h1>

  <div class="prose">
    <p>
      All published security issues are <a href="{% gh_issues_url %}" target="_blank">tracked and resolved on GitHub</a>.
    </p>
  </div>

  <div class="column gap">
    {% for issue_context in issue_contexts %}
      {% issue issue_context %}
    {% endfor %}
  </div>
{% endblock content %}
